# Java kurulumu GEREKTİRMEYEN, platforma özel TEK-DOSYA "tıkla & çalıştır"
# paketleri üretir: Windows → .exe, macOS → .dmg, Linux → .AppImage.
#
#   - Manuel tetikleme: Actions sekmesi → "Run workflow" (artifact olarak indirilir).
#   - Release yayınlandığında: dosyaları + SHA256SUMS'u o release'e asset olarak ekler.
#
# Paketler scripts/package-dist.sh ile üretilir. Windows (.exe, NSIS) ve Linux
# (.AppImage, mksquashfs) hedefleri Linux runner'ında üretilir; macOS (.dmg)
# codesign/notarytool/stapler için macOS runner'ında çalışır.
#
# macOS imzalama runhq desenini izler: aşağıdaki 6 secret doluysa Developer ID
# + hardened runtime + entitlements ile imzalanıp notarize edilir; secret yoksa
# script ad-hoc "seal" eder (macOS 14+ "damaged" hatasını yine de önler).
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
name: Bundle (JRE-gömülü paketler)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write # release asset upload için

jobs:
  jar:
    name: Fat-jar build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build (test atla)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: target/mersel-dss-agent-signer-api.jar
          retention-days: 1

  bundle:
    name: Paketle ${{ matrix.target }}
    needs: jar
    runs-on: ${{ matrix.runner }}
    # secrets.X doğrudan if: içinde kullanılamaz → "Developer ID cert var mı?"
    # bilgisini job-level boolean string ('true'/'false') olarak yüzeye çıkarıp
    # macOS imza/keychain adımını buna göre koşullarız. Değer secret'ı sızdırmaz,
    # yalnızca varlığını gösterir (runhq deseni).
    env:
      APPLE_CERT_PRESENT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (.exe) + Linux (.AppImage): Linux runner'ında üretilir.
          - { target: windows-x64, runner: ubuntu-latest }
          - { target: windows-x86, runner: ubuntu-latest }
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-latest }
          # macOS (.dmg): codesign/notarytool/stapler yalnız macOS'ta çalışır.
          # Tek macOS runner hem x64 hem arm64 bundle'ı imzalayabilir (codesign
          # + notarization mimari-bağımsızdır).
          - { target: macos-x64, runner: macos-14 }
          - { target: macos-arm64, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - name: Fat-jar'ı indir
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: target
      - name: "Araçlar (Linux: .exe için NSIS, .AppImage için squashfs-tools)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip nsis squashfs-tools
      - name: Apple Developer ID'yi geçici keychain'e al (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_PRESENT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          # İmzalı keychain'i aramaya dahil et (mevcutları koru).
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Paketle (${{ matrix.target }})
        env:
          # macOS imza/notarization: secret'lar boşsa script ad-hoc'a düşer.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          chmod +x scripts/package-dist.sh
          scripts/package-dist.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
          retention-days: 7

  release:
    name: Release asset'leri ekle
    needs: bundle
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Tüm paketleri indir
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS üret
        run: |
          cd dist
          sha256sum *.exe *.dmg *.AppImage *.zip 2>/dev/null > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.exe dist/*.dmg dist/*.AppImage dist/*.zip dist/SHA256SUMS.txt \
            --clobber --repo "${{ github.repository }}"
